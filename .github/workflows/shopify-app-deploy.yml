name: Deploy Shopify app configuration

# Pushes an app's shopify.app.<name>.toml to Shopify as a new released app
# version (scopes, URLs, compliance webhooks). Run by hand from the Actions tab.
# Needs the repository secret SHOPIFY_CLI_PARTNERS_TOKEN (Partner Dashboard ->
# Settings -> CLI token); it never appears in the repository.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Which app configuration to deploy"
        required: true
        default: janoubona-live
        type: choice
        options:
          - janoubona-live
          - store
      client_id:
        description: "For 'store' only: the store's own app client id (public)"
        required: false
        type: string
      app_name:
        description: "For 'store' only: the app's name, e.g. Janoubona - Shop name"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build a store app's configuration from the template
        if: inputs.config == 'store'
        env:
          CLIENT_ID: ${{ inputs.client_id }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          case "$CLIENT_ID" in (*[!a-f0-9]*|"") echo "client_id must be hex"; exit 1;; esac
          case "$APP_NAME" in (*[!A-Za-z0-9\ -]*|"") echo "app_name: letters, digits, spaces, hyphens"; exit 1;; esac
          sed -e "s/__CLIENT_ID__/$CLIENT_ID/" -e "s/__APP_NAME__/$APP_NAME/" \
            shopify.app.store-template.toml > shopify.app.store.toml
      - name: Deploy
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}
          CONFIG: ${{ inputs.config }}
        run: npx --yes @shopify/cli@latest app deploy --config "$CONFIG" --force
