# Template for one store's own app (custom distribution). The deploy workflow
# fills in the client id and name, then runs shopify app deploy. Must match
# what the connector serves and SHOPIFY_SCOPES (app/config.py).
client_id = "__CLIENT_ID__"
name = "__APP_NAME__"
application_url = "https://connect.halyoon.com/"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_publications,write_publications,read_themes,write_themes,write_files,read_markets,write_markets,read_shipping,write_shipping,read_inventory,read_locations,write_orders,write_draft_orders,read_fulfillments,unauthenticated_read_product_listings"
# Shopify-managed install: the connector completes it by token exchange.
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://connect.halyoon.com/shopify/callback"]

[webhooks]
api_version = "2026-07"

# Mandatory privacy webhooks, answered by app/api/shopify_routes.py (HMAC-checked).
# app/uninstalled and shop/update are subscribed per store at connection.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://connect.halyoon.com/shopify/webhooks"

[pos]
embedded = false
